name: CI

on:
  push:
  pull_request:
    branches:
      - master
      - dev
      - main

jobs:
  build_multi-lang:
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.21

    steps:
      - name: Install dependencies (apk)
        run: apk add --no-cache gcc-riscv-none-elf g++-riscv-none-elf gcc-arm-none-eabi g++-arm-none-eabi findutils python3 py3-pip make git bash musl-dev
        
      - name: Install dependencies (python)
        run: python3 -m pip install --break-system-packages bdflib pyyaml
        
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Git ownership exception
        run: git config --global --add safe.directory /__w/IronOS/IronOS && git config --global safe.directory "$GITHUB_WORKSPACE"

      - name: Git meta info
        run: echo "GITHUB_CI_PR_SHA=${{github.event.pull_request.head.sha}}" >> "${GITHUB_ENV}"

      - name: Build Pinecilv2
        # 모든 언어 배포본을 한 번에 다 구워냅니다. (한국어 포함 팩 확보용)
        run: make -C source/ -j$(nproc) model="Pinecilv2" firmware-multi_compressed_European firmware-multi_compressed_Belarusian+Bulgarian+Russian+Serbian+Ukrainian firmware-multi_Chinese+Japanese

      - name: Copy license files
        run: cp LICENSE scripts/LICENSE_RELEASE.md source/Hexfile/

      - name: Generate json index file
        run: ./source/metadata.py Pinecilv2_multi-lang.json

      - name: Archive Pinecilv2 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Pinecilv2_multi-lang
          path: |
            source/Hexfile/Pinecilv2_*.hex
            source/Hexfile/Pinecilv2_*.dfu
            source/Hexfile/Pinecilv2_*.bin
            source/Hexfile/Pinecilv2_*.elf
            source/Hexfile/Pinecilv2_multi-lang.json
            source/Hexfile/LICENSE
            source/Hexfile/LICENSE_RELEASE.md
          if-no-files-found: error
