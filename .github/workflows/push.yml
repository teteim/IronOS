name: CI

on:
  push:
  pull_request:
    branches:
      - master
      - dev
      - main

jobs:
  build-korean-firmware:
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.21

    steps:
      - name: Install dependencies (apk)
        run: apk add --no-cache gcc-riscv-none-elf g++-riscv-none-elf gcc-arm-none-eabi g++-arm-none-eabi findutils python3 py3-pip make git bash musl-dev

      - name: Install dependencies (python)
        run: python3 -m pip install --break-system-packages bdflib pyyaml

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Git ownership exception
        run: git config --global --add safe.directory /__w/IronOS/IronOS && git config --global safe.directory "$GITHUB_WORKSPACE"

      - name: Git meta info
        run: echo "GITHUB_CI_PR_SHA=${{github.event.pull_request.head.sha}}" >> "${GITHUB_ENV}"

      # 예전에 있던 "Parse BDF and Inject into font_tables.py" 스텝은 제거했습니다.
      # font_tables.py에 이미 get_font_map_korean()이 정식으로 들어있고
      # make_translation.py도 get_korean_glyph()로 이미 연결되어 있어서
      # 빌드 시점에 폰트를 억지로 주입할 필요가 없습니다.

      # 언어 선택 메뉴가 뜨려면 단일 언어(locales="KO") 빌드가 아니라
      # 여러 언어를 묶는 multi 빌드여야 합니다. custom_multi_langs가
      # 그 실제 Makefile 변수이고, locales는 존재하지 않는 변수라 조용히
      # 무시되어 그동안 기본값(영어 단독, firmware-EN)만 빌드되고 있었습니다.
      - name: Build Pinecilv2 EN+KO multi-language firmware
        run: make -C source/ -j$(nproc) model="Pinecilv2" custom_multi_langs="EN KO" Hexfile/Pinecilv2_multi_Custom.bin Hexfile/Pinecilv2_multi_Custom.hex Hexfile/Pinecilv2_multi_Custom.dfu

      - name: Copy license files
        run: cp LICENSE scripts/LICENSE_RELEASE.md source/Hexfile/

      - name: Archive Pinecilv2 Korean-enabled Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Pinecilv2_EN_KO_multi_FW
          path: |
            source/Hexfile/Pinecilv2_multi_Custom.hex
            source/Hexfile/Pinecilv2_multi_Custom.bin
            source/Hexfile/Pinecilv2_multi_Custom.dfu
            source/Hexfile/Pinecilv2_multi_Custom.elf
          if-no-files-found: error
