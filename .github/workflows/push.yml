name: CI

on:
  push:
  pull_request:
    branches:
      - master
      - dev
      - main

jobs:
  build-korean-ultimate:
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.21

    steps:
      - name: Install dependencies (apk)
        run: apk add --no-cache gcc-riscv-none-elf g++-riscv-none-elf gcc-arm-none-eabi g++-arm-none-eabi findutils python3 py3-pip make git bash musl-dev
        
      - name: Install dependencies (python)
        run: python3 -m pip install --break-system-packages bdflib pyyaml
        
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Git ownership exception
        run: git config --global --add safe.directory /__w/IronOS/IronOS && git config --global safe.directory "$GITHUB_WORKSPACE"

      - name: Git meta info
        run: echo "GITHUB_CI_PR_SHA=${{github.event.pull_request.head.sha}}" >> "${GITHUB_ENV}"

      - name: Overwrite 순정 폰트 강제 덮어쓰기
        # 빌더가 무조건 읽게 설계된 순정 폰트 파일(wenquanyi_9pt.bdf 등) 자리에 
        # 우리가 만든 한글 248자 'test.bdf' 파일의 내용을 강제로 복사하여 대체시킵니다!
        run: |
          if [ -f Translations/test.bdf ]; then
            # 순정 다국어 빌더가 참조하는 메인 BDF 폰트 경로를 강제로 덮어씌웁니다.
            cp Translations/test.bdf Translations/wenquanyi_9pt.bdf
            echo "✅ 순정 폰트 더미에 한글 글리프 강제 이식 완료!"
          else
            echo "❌ 에러: Translations/test.bdf 파일이 저장소에 없습니다!"
            exit 1
          fi

      - name: Build Pinecilv2 Multi-Lang
        # 한국어가 포함되도록 설계된 공식 다국어 팩(Chinese+Japanese) 빌드를 내립니다.
        # 내부 폰트가 우리 한글로 바뀌었기 때문에, 튀어나오는 아시아 팩 바이너리 안에 한글 메뉴가 무조건 구워집니다.
        run: make -C source/ -j$(nproc) model="Pinecilv2" firmware-multi_Chinese+Japanese

      - name: Copy license files
        run: cp LICENSE scripts/LICENSE_RELEASE.md source/Hexfile/

      - name: Archive Pinecilv2 Korean Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Pinecilv2_True_Korean_FW
          path: |
            source/Hexfile/Pinecilv2_*.hex
            source/Hexfile/Pinecilv2_*.dfu
            source/Hexfile/Pinecilv2_*.bin
            source/Hexfile/Pinecilv2_*.elf
          if-no-files-found: error
