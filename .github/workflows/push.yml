name: CI

on:
  push:
  pull_request:
    branches:
      - master
      - dev
      - main

jobs:
  build-korean-font-injection:
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.21

    steps:
      - name: Install dependencies (apk)
        run: apk add --no-cache gcc-riscv-none-elf g++-riscv-none-elf gcc-arm-none-eabi g++-arm-none-eabi findutils python3 py3-pip make git bash musl-dev
        
      - name: Install dependencies (python)
        run: python3 -m pip install --break-system-packages bdflib pyyaml
        
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Git ownership exception
        run: git config --global --add safe.directory /__w/IronOS/IronOS && git config --global safe.directory "$GITHUB_WORKSPACE"

      - name: Git meta info
        run: echo "GITHUB_CI_PR_SHA=${{github.event.pull_request.head.sha}}" >> "${GITHUB_ENV}"

      - name: Parse BDF and Inject into font_tables.py
        # Translations/test.bdf 파일의 BITMAP 데이터를 파싱하여 
        # font_tables.py 내의 대형 폰트 세트에 강제로 병합시키는 파이썬 런타임 빌더입니다.
        run: |
          python3 -c "
          import os

          bdf_path = 'Translations/test.bdf'
          font_table_path = 'Translations/font_tables.py' # 시스템에 따라 경로 확인 필요
          
          if not os.path.exists(font_table_path):
              # 만약 Translations 폴더 내에 없다면 폰트 소스 본진 경로 탐색
              font_table_path = 'source/Core/Fonts/font_tables.py'

          print(f'Target Font Table: {font_table_path}')

          # 1. BDF 파일에서 유니코드 고유 포인트와 BITMAP 16진수 라인 파싱
          korean_glyphs = {}
          with open(bdf_path, 'r', encoding='utf-8') as f:
              lines = f.readlines()

          current_cp = None
          in_bitmap = False
          current_bitmap = []

          for line in lines:
              line = line.strip()
              if line.startswith('ENCODING'):
                  current_cp = int(line.split()[1])
              elif line.startswith('BITMAP'):
                  in_bitmap = True
                  current_bitmap = []
              elif line.startswith('ENDCHAR'):
                  in_bitmap = False
                  if current_cp is not None:
                      korean_glyphs[current_cp] = current_bitmap
              elif in_bitmap:
                  # 16진수 문자열을 파인실 내부 폰트 구조인 바이트 포맷(0xXX)으로 가공
                  # 12x16 폰트는 대개 2바이트씩 16라인(총 32바이트) 배열을 요구함
                  hex_str = line
                  if len(hex_str) == 4: # 예: 7EC0 -> 0x7E, 0xC0
                      high = f'0x{hex_str[:2]}'
                      low = f'0x{hex_str[2:]}'
                      current_bitmap.extend([high, low])

          # 2. font_tables.py의 대형 폰트 사전(예: 대형 폰트셋 변수 이름)에 우리 서브셋 주입
          with open(font_table_path, 'r', encoding='utf-8') as f:
              table_code = f.read()

          # font_tables.py 내부의 대형 사전 닫히기 직전 괄호 나 변수 끝단을 찾아 248자 강제 인젝션
          # 가장 안전한 방법은 기존 대형 폰트 사전 변수(예: 무조건 참조되는 딕셔너리 명)에 '.update()' 코드를 파일 맨 밑에 첨부하는 것입니다.
          injection_code = '\n\n# --- 커스텀 한글 서브셋 248자 강제 주입 패치 ---\n'
          injection_code += 'korean_subset = {\n'
          for cp, bytes_list in korean_glyphs.items():
              injection_code += f'    {cp}: [{ \", \".join(bytes_list) }],\n'
          injection_code += '}\n'
          
          # IronOS 빌더가 참조하는 최상위 딕셔너리(예: wide_font_table 또는 대형 글꼴 변수명)에 병합
          # 시스템 내 대형 글꼴 딕셔너리명이 'font_table' 혹은 'wide_font'일 가능성을 고려하여 바인딩 업데이트 조치
          injection_code += 'if \"wide_font\" in locals() or \"font_table\" in locals():\n'
          injection_code += '    try: wide_font.update(korean_subset)\n'
          injection_code += '    except: pass\n'
          injection_code += '    try: font_table.update(korean_subset)\n'
          injection_code += '    except: pass\n'

          with open(font_table_path, 'a', encoding='utf-8') as f:
              f.write(injection_code)

          print('✅ BDF 글리프 데이터를 font_tables.py 소스코드 내부에 인젝션 완료!')
          "

      - name: Build Pinecilv2 Custom Korean Only
        # 소스코드 딕셔너리 자체가 물리적으로 확장되었기 때문에, locales="KO" 단독 빌드 시 
        # make_translation.py가 KeyError 없이 완벽하게 컴파일을 완주할 것으로 예상됩니다.
        run: make -C source/ -j$(nproc) model="Pinecilv2" locales="KO"

      - name: Copy license files
        run: cp LICENSE scripts/LICENSE_RELEASE.md source/Hexfile/

      - name: Archive Pinecilv2 True Korean Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Pinecilv2_True_Korean_FW
          path: |
            source/Hexfile/Pinecilv2_*.hex
            source/Hexfile/Pinecilv2_*.dfu
            source/Hexfile/Pinecilv2_*.bin
            source/Hexfile/Pinecilv2_*.elf
          if-no-files-found: error
